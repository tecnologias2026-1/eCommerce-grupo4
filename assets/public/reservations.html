<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Reservaciones - Eventos Decoraciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Spectral:wght@400;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    
    <link rel="stylesheet" href="../../css/media.css">
    <script src="../../js/cookie-consent.js" defer></script>
    <script src="../../js/manager.js" defer></script>
    <script src="../../js/reveal.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>
    <header class="hero-selection">
        <a href="auth.html" class="btn-logout">Cerrar Sesión</a>
        <h1 class="hero-selection__title">Reservaciones</h1>
    </header>

    <main class="reservations-content">
        <div class="reservations-list">
            <!-- Rendered cards here -->
        </div>
    </main>

    <script src="../../js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.querySelector('.reservations-list');

            function renderReservations(allReservations) {

            // Handle Clear History
            const clearBtn = document.getElementById('clear-reservations');
            if (clearBtn) {
                clearBtn.onclick = () => {
                    if (confirm('¿Estás seguro de que quieres borrar todo el historial?')) {
                        localStorage.removeItem('allReservations');
                        window.location.reload();
                    }
                };
            }

            // allReservations list: normalizes API response to local shape if needed
            if (allReservations.length === 0) {
                listContainer.innerHTML = '<p class="empty-msg">No hay reservaciones registradas aún.</p>';
                return;
            }

            allReservations.sort((a, b) => new Date(b.timestamp || b.created_at) - new Date(a.timestamp || a.created_at));

            listContainer.innerHTML = '';
            allReservations.forEach((res, index) => {
                // Normalize API shape (snake_case) to local shape (camelCase)
                const groom = res.groom || res.groom_name || '';
                const bride = res.bride || res.bride_name || '';
                const venue = res.venue || res.venue_name || '';
                const venueImage = res.venueImage || res.venue_image || '';
                const weddingDate = res.weddingDate || res.wedding_date || '';
                const status = res.status || 'Pendiente';
                const totalPrice = res.totalPrice || res.total_price
                    ? (res.totalPrice || ('COL$ ' + Number(res.total_price).toLocaleString('es-CO')))
                    : 'COL$ 0';

                const card = document.createElement('div');
                card.className = 'res-card';
                card.style.cursor = 'pointer';
                card.dataset.index = index;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Ver detalle de la reserva de ${groom} y ${bride}`);
                card.innerHTML = `
                    <div class="res-card__info">
                        <h2 class="res-card__title">${groom.toUpperCase()} Y<br>${bride.toUpperCase()}</h2>
                        <p class="res-card__venue">${venue}</p>
                        <p class="res-card__date">Fecha: ${weddingDate}</p>
                        <p class="res-card__status">Estado: <span>${status}</span></p>
                        <p class="res-card__price">${totalPrice}</p>
                    </div>

                    <div class="res-card__media-grid">
                        <div class="media-slot">
                            <img src="${venueImage || 'https://via.placeholder.com/300x200?text=Hacienda'}" alt="Hacienda" loading="lazy">
                            <span>CEREMONIA PREMIUM</span>
                        </div>
                        <div class="media-slot empty">
                            <div class="placeholder-img"></div>
                            <span>RECEPCION PREMIUM</span>
                        </div>
                        <div class="media-slot empty">
                            <div class="placeholder-img"></div>
                            <span>COMIDA PREMIUM</span>
                        </div>
                        <div class="media-slot empty">
                            <div class="placeholder-img"></div>
                            <span>DECORACION FLORAL</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    localStorage.setItem('viewingReservation', JSON.stringify(res));
                    window.location.href = 'reservations_view.html';
                });

                card.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        localStorage.setItem('viewingReservation', JSON.stringify(res));
                        window.location.href = 'reservations_view.html';
                    }
                });

                listContainer.appendChild(card);
            });
            } // end renderReservations

            // Try API first, fall back to localStorage
            const storedEmail = localStorage.getItem('userEmail') || '';
            if (typeof apiFetch === 'function' && storedEmail) {
                apiFetch('/reservations?email=' + encodeURIComponent(storedEmail))
                    .then(function (data) {
                        if (Array.isArray(data) && data.length > 0) {
                            renderReservations(data);
                        } else {
                            renderReservations(JSON.parse(localStorage.getItem('allReservations') || '[]'));
                        }
                    })
                    .catch(function () {
                        renderReservations(JSON.parse(localStorage.getItem('allReservations') || '[]'));
                    });
            } else {
                renderReservations(JSON.parse(localStorage.getItem('allReservations') || '[]'));
            }
        });
    </script>
    <div id="footer-placeholder"></div>
</body>

</html>
