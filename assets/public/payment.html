<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Spectral:wght@600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    
    <link rel="stylesheet" href="../../css/media.css">
    <script src="../../js/cookie-consent.js" defer></script>
    <script src="../../js/manager.js" defer></script>
    <script src="../../js/reveal.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>
    <header class="hero-selection" data-reveal>
        <div class="hero-selection__top">
                <h1 class="hero-selection__title" data-reveal>PAGO</h1>
        </div>
    </header>

    <main class="userdata-content" data-reveal>
        <form class="userdata-form" aria-labelledby="payment-form-legend" data-reveal>
            <fieldset class="form-grid">
                <legend id="payment-form-legend" class="visually-hidden">Datos de contacto y reserva</legend>
                <div class="form-group" data-reveal data-reveal-delay="100">
                    <label for="groom-name">Nombre del Novio</label>
                    <input type="text" id="groom-name" autocomplete="name" placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group" data-reveal data-reveal-delay="200">
                    <label for="bride-name">Nombre de la Novia</label>
                    <input type="text" id="bride-name" autocomplete="name" placeholder="Ej. María García">
                </div>
                <div class="form-group" data-reveal data-reveal-delay="300">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" autocomplete="email" placeholder="email@ejemplo.com">
                    <p class="form-error-text" id="email-error">correo no valido</p>
                </div>
                <div class="form-group" data-reveal data-reveal-delay="400">
                    <label for="phone">Teléfono de Contacto</label>
                    <input type="tel" id="phone" autocomplete="tel" placeholder="+57 300 000 0000">
                    <p class="form-error-text" id="phone-error">caracter invalido</p>
                </div>
                <div class="form-group" data-reveal data-reveal-delay="500">
                    <label for="wedding-date">Fecha tentativa de la boda</label>
                    <input type="date" id="wedding-date" readonly>
                    <p class="form-help-text">Para editar fecha revise nuevamente el inicio por disponibilidad</p>
                </div>
                <div class="form-group" data-reveal data-reveal-delay="600">
                    <label for="deposit">Abono de la Reserva</label>
                    <input type="text" id="deposit" placeholder="">
                    <p class="form-error-text" id="deposit-error"></p>
                </div>
                <div class="form-group full-width" data-reveal data-reveal-delay="700">
                    <label for="comments">¿Tienes algún requerimiento especial?</label>
                    <input type="text" id="comments"
                        placeholder="Ej. Necesitamos acceso para personas con movilidad reducida">
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="summary-pago" data-reveal>
        <div class="summary-cart">
            <span class="summary-total-label">Costo Total</span>
            <span class="summary-total-value" id="final-total">COL$ 0</span>
        </div>
        <span class="summary-footer-note">Procesaremos tu pago por medio de Mercado Pago.</span>
        <a class="btn-pay-mp" id="btn-pay-mp" href="confirm.html" role="button">
            <span class="btn-pay-mp__logo-wrap">
                <img src="../images/mercado-pago-badge.png" alt="Mercado Pago">
            </span>
            <span>Ir a pagar</span>
        </a>
    </footer>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateTotal();
        });

        function parsePrice(priceStr) {
            if (typeof priceStr === 'number') return priceStr;
            return parseInt(String(priceStr).replace(/[^0-9]/g, '')) || 0;
        }

        function updateTotal() {
            const cart = JSON.parse(localStorage.getItem('weddingCart') || '{}');
            let total = 0;

            if (cart.selectedVenue) {
                total += parsePrice(cart.selectedVenue.price);
            }
            if (cart.ceremony) {
                Object.values(cart.ceremony).forEach(item => { total += parsePrice(item.price); });
            }
            if (cart.reception) {
                Object.values(cart.reception).forEach(item => { total += parsePrice(item.price); });
            }
            if (cart.food) {
                Object.values(cart.food).forEach(item => {
                    total += parsePrice(item.unitPrice) * (item.quantity || 1);
                });
            }
            if (cart.others) {
                Object.values(cart.others).forEach(item => {
                    total += item.totalPrice || parsePrice(item.price);
                });
            }

            const totalEl = document.getElementById('final-total');
            if (totalEl) {
                totalEl.textContent = 'COL$ ' + total.toLocaleString('es-CO');
            }
        }

        window.addEventListener('storage', (event) => {
            if (event.key === 'weddingCart') updateTotal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('wedding-date');
            const storedDate = localStorage.getItem('selectedWeddingDate');
            if (dateInput && storedDate) {
                dateInput.value = storedDate;
            }

            const depositInput = document.getElementById('deposit');
            const depositError = document.getElementById('deposit-error');

            function updateDepositPlaceholder() {
                const cart = JSON.parse(localStorage.getItem('weddingCart') || '{}');
                let total = 0;
                if (cart.selectedVenue) total += parsePrice(cart.selectedVenue.price);
                if (cart.ceremony) Object.values(cart.ceremony).forEach(item => { total += parsePrice(item.price); });
                if (cart.reception) Object.values(cart.reception).forEach(item => { total += parsePrice(item.price); });
                if (cart.food) Object.values(cart.food).forEach(item => { total += parsePrice(item.unitPrice) * (item.quantity || 1); });
                if (cart.others) Object.values(cart.others).forEach(item => { total += item.totalPrice || parsePrice(item.price); });

                const minimo = Math.round(total * 0.5);
                if (depositInput) {
                    depositInput.placeholder = 'COL$ ' + minimo.toLocaleString('es-CO') + ' (mínimo 50%)';
                    depositInput.dataset.minimo = minimo;
                    depositInput.dataset.total = total;
                }
            }

            updateDepositPlaceholder();
            window.addEventListener('storage', updateDepositPlaceholder);

            function validateDeposit() {
                if (!depositInput || !depositError) return;
                const val = parseInt(depositInput.value.replace(/[^\d]/g, '')) || 0;
                const minimo = parseInt(depositInput.dataset.minimo) || 0;
                const total = parseInt(depositInput.dataset.total) || 0;

                if (depositInput.value.trim() === '') {
                    depositError.style.display = 'none';
                    depositInput.classList.remove('field--invalid');
                    return;
                }

                if (val < minimo) {
                    depositError.textContent = 'Debe ser mínimo el 50% (COL$ ' + minimo.toLocaleString('es-CO') + ')';
                    depositError.style.display = 'block';
                    depositInput.classList.add('field--invalid');
                } else if (val > total) {
                    depositError.textContent = 'La cantidad no puede superar el total (COL$ ' + total.toLocaleString('es-CO') + ')';
                    depositError.style.display = 'block';
                    depositInput.classList.add('field--invalid');
                } else {
                    depositError.style.display = 'none';
                    depositInput.classList.remove('field--invalid');
                }
            }

            if (depositInput) {
                depositInput.addEventListener('input', () => {
                    // Auto-format with thousand separators
                    const raw = depositInput.value.replace(/[^\d]/g, '');
                    if (raw) {
                        const formatted = parseInt(raw).toLocaleString('es-CO');
                        depositInput.value = formatted;
                    } else {
                        depositInput.value = '';
                    }
                    validateDeposit();
                });
            }

            const payBtn = document.getElementById('btn-pay-mp');
            if (payBtn) {
                payBtn.addEventListener('click', (e) => {
                    const requiredFieldIds = ['groom-name', 'bride-name', 'email', 'phone', 'wedding-date', 'deposit'];
                    let isComplete = true;
                    let hasInvalidFormat = false;

                    // Reset previous validation states
                    requiredFieldIds.forEach(id => {
                        const input = document.getElementById(id);
                        if (input) input.classList.remove('field--invalid');
                    });
                    
                    // Specific error message reset
                    const emailError = document.getElementById('email-error');
                    const phoneError = document.getElementById('phone-error');
                    if (emailError) emailError.style.display = 'none';
                    if (phoneError) phoneError.style.display = 'none';

                    for (const id of requiredFieldIds) {
                        const input = document.getElementById(id);
                        if (!input) continue;

                        const value = input.value.trim();
                        
                        // 1. Check if empty
                        if (!value) {
                            isComplete = false;
                            input.classList.add('field--invalid');
                        } else {
                            // 2. Format validation
                            if (id === 'email' && !value.includes('@')) {
                                hasInvalidFormat = true;
                                input.classList.add('field--invalid');
                                if (emailError) emailError.style.display = 'block';
                            }
                            if (id === 'phone' && !/^\d+$/.test(value)) {
                                hasInvalidFormat = true;
                                input.classList.add('field--invalid');
                                if (phoneError) phoneError.style.display = 'block';
                            }
                        }
                    }

                    if (!isComplete) {
                        e.preventDefault();
                        if (typeof showCustomAlert === 'function') {
                            showCustomAlert('informacion incompleta', 'llena los datos para continuar con el pago');
                        } else {
                            alert('informacion incometa. llena los datos para continuar con el pago');
                        }
                        return;
                    }

                    // Validate deposit separately
                    const depositEl = document.getElementById('deposit');
                    const depositMsg = document.getElementById('deposit-error');
                    if (depositEl && depositMsg && depositMsg.style.display === 'block') {
                        e.preventDefault();
                        if (typeof showCustomAlert === 'function') {
                            showCustomAlert('abono invalido', depositMsg.textContent);
                        } else {
                            alert(depositMsg.textContent);
                        }
                        return;
                    }

                    if (hasInvalidFormat) {
                        e.preventDefault();
                        if (typeof showCustomAlert === 'function') {
                            showCustomAlert('datos invalidos', 'revisa que el correo tenga @ y el telefono sea solo numeros');
                        } else {
                            alert('formato incorrecto. Revisa el correo y el teléfono');
                        }
                        return;
                    }

                    // All validations passed — save reservation and navigate
                    e.preventDefault();
                    (function submitReservation() {
                        var groomVal   = (document.getElementById('groom-name') || {}).value || '';
                        var brideVal   = (document.getElementById('bride-name') || {}).value || '';
                        var emailVal   = (document.getElementById('email') || {}).value || '';
                        var phoneVal   = (document.getElementById('phone') || {}).value || '';
                        var dateVal    = (document.getElementById('wedding-date') || {}).value || '';
                        var depositRaw = ((document.getElementById('deposit') || {}).value || '').replace(/[^\d]/g, '');
                        var depositAmt = parseInt(depositRaw) || 0;
                        var commentsVal = (document.getElementById('comments') || {}).value || '';

                        var cart = JSON.parse(localStorage.getItem('weddingCart') || '{}');
                        var venue = cart.selectedVenue || {};
                        var totalStr = document.getElementById('final-total')
                            ? document.getElementById('final-total').textContent
                            : 'COL$ 0';

                        function makeCode() {
                            return '#WP-' + Math.floor(100000 + Math.random() * 900000);
                        }

                        var reservation = {
                            id: makeCode(),
                            groom: groomVal,
                            bride: brideVal,
                            email: emailVal,
                            phone: phoneVal,
                            venue: venue.name || '',
                            venueImage: venue.image || '',
                            guests: venue.guests || localStorage.getItem('selectedGuests') || '0',
                            weddingDate: dateVal,
                            status: 'Pendiente',
                            totalPrice: totalStr,
                            depositAmount: depositAmt,
                            cart: cart,
                            comments: commentsVal,
                            timestamp: Date.now()
                        };

                        // Save to localStorage as fallback
                        var allReservations = JSON.parse(localStorage.getItem('allReservations') || '[]');
                        allReservations.push(reservation);
                        localStorage.setItem('allReservations', JSON.stringify(allReservations));

                        function doNavigate() {
                            localStorage.removeItem('weddingCart');
                            window.location.href = payBtn.getAttribute('href') || 'confirm.html';
                        }

                        // Try POST to API
                        if (typeof API_BASE !== 'undefined') {
                            fetch(API_BASE + '/reservations', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    groom_name: groomVal,
                                    bride_name: brideVal,
                                    email: emailVal,
                                    phone: phoneVal,
                                    venue_slug: venue.slug || '',
                                    wedding_date: dateVal,
                                    guest_count: parseInt(reservation.guests) || 0,
                                    special_requirements: commentsVal,
                                    deposit_amount: depositAmt,
                                    total_price: parseInt(String(totalStr).replace(/[^\d]/g, '')) || 0,
                                    cart: cart
                                })
                            })
                            .then(function (res) {
                                if (!res.ok) {
                                    return res.text().then(function(text) {
                                        console.error('[Reserva] Error del servidor:', res.status, text);
                                        return null;
                                    });
                                }
                                return res.json();
                            })
                            .then(function (data) {
                                if (data && data.code) {
                                    localStorage.setItem('reservationCode', data.code);
                                    var all2 = JSON.parse(localStorage.getItem('allReservations') || '[]');
                                    var last = all2[all2.length - 1];
                                    if (last) { last.id = data.code; }
                                    localStorage.setItem('allReservations', JSON.stringify(all2));
                                }
                                doNavigate();
                            })
                            .catch(function (err) {
                                console.error('[Reserva] Error de red al enviar al backend:', err);
                                doNavigate();
                            });
                        } else {
                            console.warn('[Reserva] API_BASE no definido — manager.js no cargó correctamente');
                            doNavigate();
                        }
                    })();
                });
            }
        });
    </script>
</body>

</html>
