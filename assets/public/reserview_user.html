<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Reserva - Wedding Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Spectral:wght@400;600;800&family=Inter:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    
    <link rel="stylesheet" href="../../css/media.css">
    <script src="../../js/cookie-consent.js" defer></script>
    <script src="../../js/manager.js" defer></script>
    <script src="../../js/reveal.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>
    <header class="hero-selection">
        <div class="hero-selection__top">
            <h1 class="hero-selection__title">Resumen de tu Boda</h1>
        </div>
    </header>

    <main class="res-view-container">
        <div class="res-view-header">
            <span class="res-view-id">CÓDIGO DE RESERVA: <span id="res-id" class="res-view-id__value">000000</span></span>
        </div>

        <div class="res-view-grid">
            <h2 class="res-view-main-title" id="res-couple">JUAN Y MARIA</h2>

            <div class="res-info-col">
                <div class="detail-group">
                    <span class="detail-label">Lugar de la Boda</span>
                    <span class="detail-value" id="res-venue">N/A</span>
                </div>
                <div class="detail-group">
                    <span class="detail-label">Fecha del Evento</span>
                    <span class="detail-value" id="res-date">N/A</span>
                </div>
                <div class="detail-group">
                    <span class="detail-label">Estado</span>
                    <span class="detail-value detail-value--status" id="res-status">Pendiente</span>
                </div>
            </div>

            <div class="res-media-col">
                <div class="res-view-image">
                    <img id="res-image" src="" alt="Hacienda" loading="lazy">
                </div>

                <div class="payment-summary">
                    <div class="payment-row">
                        <span class="payment-label">Monto Total:</span>
                        <span class="payment-value" id="pay-total">COL$ 0</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Monto Pagado:</span>
                        <span class="payment-value payment-value--paid" id="pay-deposit">COL$ 0</span>
                    </div>
                    <div class="payment-row payment-row--total">
                        <span class="payment-label">Pendiente:</span>
                        <span class="payment-value payment-value--pending" id="pay-pending">COL$ 0</span>
                    </div>
                </div>

                <div class="user-actions-bar">
                    <a href="https://wa.me/573000000000" class="btn-action-user btn-chat" target="_blank" rel="noopener noreferrer">Hablar con un
                        asesor</a>
                </div>
            </div>

            <!-- Resto de detalles vacíos como se pidió -->
            <div class="detail-group detail-group--full-span">
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var stored = JSON.parse(localStorage.getItem('viewingUserReservation'));
            var payMoreBtn = document.getElementById('btn-pay-more');

            if (payMoreBtn) {
                payMoreBtn.addEventListener('click', function () {
                    alert('Redirigiendo a pasarela de pagos...');
                });
            }

            if (!stored) {
                window.location.href = 'reservcode.html';
                return;
            }

            function populate(r) {
                var id     = (r.code || r.id || '000000').replace(/^#/, '');
                var groom  = r.groom_name  || r.groom  || '';
                var bride  = r.bride_name  || r.bride  || '';
                var venue  = r.venue_name  || r.venue  || '';
                var date   = r.wedding_date|| r.weddingDate || '';
                var status = r.status      || 'Pendiente';
                var image  = r.venue_image || r.venueImage || '';

                var totalRaw = r.total_price != null
                    ? Number(r.total_price)
                    : parseInt((r.totalPrice || '0').replace(/[^0-9]/g, '')) || 0;
                var depositRaw = r.deposit_amount != null
                    ? Number(r.deposit_amount)
                    : parseInt((r.deposit || r.depositAmount || '0').replace(/[^0-9]/g, '')) || 0;

                document.getElementById('res-id').textContent = id;
                document.getElementById('res-couple').innerHTML = groom.toUpperCase() + ' Y<br>' + bride.toUpperCase();
                document.getElementById('res-venue').textContent = venue;
                document.getElementById('res-date').textContent = date;
                document.getElementById('res-status').textContent = status;
                if (image) document.getElementById('res-image').src = image;

                document.getElementById('pay-total').textContent = 'COL$ ' + totalRaw.toLocaleString('es-CO');
                document.getElementById('pay-deposit').textContent = 'COL$ ' + depositRaw.toLocaleString('es-CO');
                document.getElementById('pay-pending').textContent = 'COL$ ' + (totalRaw - depositRaw).toLocaleString('es-CO');
            }

            // Show immediately from localStorage, then refresh from API
            populate(stored);

            var code = (stored.code || stored.id || '').replace(/^#/, '');
            if (code && typeof apiFetch === 'function') {
                apiFetch('/reservations/' + code)
                    .then(function (data) { if (data && (data.code || data.id)) populate(data); })
                    .catch(function () { /* keep localStorage render */ });
            }
        });
    </script>
    <div id="footer-placeholder"></div>
</body>

</html>
